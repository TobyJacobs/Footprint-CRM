[build]
  command = "npm run build"
  publish = ".next"
  # Don't rebuild (and spend build credits) when only notes or seed scripts
  # changed. Netlify skips the build when this command exits with 0.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)supabase/seed' ':(exclude)*.md'"

[build.environment]
  NODE_VERSION = "24"
  # Next.js keeps a private build cache (never published) that records
  # environment values, which tripped Netlify's secret scanner. Skip only that
  # cache folder; everything that is published is still scanned.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"

# Turns the Next.js build into a working Netlify site (server pages, login
# checks, etc.). Netlify didn't detect Next.js automatically because the site
# was created while the repository was still empty.
[[plugins]]
  package = "@netlify/plugin-nextjs"
